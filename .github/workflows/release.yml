name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  QT_VERSION: "6.12.0"
  QTBASE_SHA256: 0529901575c413e34ded504eeda177c4a6dfd0dff1e39ed52c811dc5204b43c7
  APP_IDENTITY: 59969450EC2C4ED8F56CB8514CCF70ED3A15E8F8

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - id: v
        run: |
          v=$(sed -nE 's/^project\(ClipboardSync VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          [ -n "$v" ] || { echo "::error::no VERSION in CMakeLists.txt's project()"; exit 1; }
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$v" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} disagrees with CMakeLists.txt's version $v"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-2025
    env:
      QT_CONFIGURE: -static -static-runtime -release
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - id: qt
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}\qt
          key: qtbase-${{ env.QT_VERSION }} ${{ env.QT_CONFIGURE }}
      - name: Static Qt
        if: steps.qt.outputs.cache-hit != 'true'
        run: |
          $zip = "$env:RUNNER_TEMP\qtbase.zip"
          Invoke-WebRequest "https://download.qt.io/official_releases/qt/$($env:QT_VERSION -replace '\.\d+$')/$env:QT_VERSION/submodules/qtbase-everywhere-src-$env:QT_VERSION.zip" -OutFile $zip
          if ((Get-FileHash $zip).Hash -ne $env:QTBASE_SHA256) { throw "qtbase source: checksum mismatch" }
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          $PSNativeCommandUseErrorActionPreference = $true
          7z x -y "-o$env:RUNNER_TEMP" $zip | Out-Null
          New-Item -ItemType Directory "$env:RUNNER_TEMP\qtbuild" | Out-Null
          Set-Location "$env:RUNNER_TEMP\qtbuild"
          & "$env:RUNNER_TEMP\qtbase-everywhere-src-$env:QT_VERSION\configure.bat" -prefix "$env:RUNNER_TEMP\qt" $env:QT_CONFIGURE.Split(' ')
          cmake --build . --parallel
          cmake --install .
      - if: steps.qt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}\qt
          key: ${{ steps.qt.outputs.cache-primary-key }}
      - name: Build
        run: |
          cmake -S . -B build -A x64 -DCMAKE_PREFIX_PATH="$env:RUNNER_TEMP\qt"
          cmake --build build --config Release
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -Last 1
          $dlls = & $dumpbin /dependents build\Release\ClipboardSync.exe | Where-Object { $_ -match '^\s+\S+\.dll$' } | ForEach-Object { $_.Trim() }
          $dlls
          if ($dlls -match '^(Qt6|vcruntime|msvcp|concrt|ucrtbase|api-ms-win-crt)') { throw "not a static build: it imports $($dlls -join ', ')" }
      - name: Installer
        run: iscc /DMyAppVersion=${{ needs.version.outputs.version }} /DSourceDir=..\build\Release packaging\ClipboardSync.iss
      - name: Install, run, uninstall
        shell: pwsh
        run: |
          $setup = Get-Item build\installer\*.exe
          Start-Process $setup -Wait -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER'
          $dir = "$env:LOCALAPPDATA\Programs\Clipboard Sync"
          if (-not (Test-Path "$dir\ClipboardSync.exe")) { throw "not installed in $dir" }
          if (-not (Test-Path "$dir\licenses\LGPL-3.0-only.txt")) { throw "no Qt licence text in $dir" }
          $run = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          if (-not (Test-Path $run)) { New-Item $run | Out-Null }
          New-ItemProperty $run -Name 'Clipboard Sync' -Value "`"$dir\ClipboardSync.exe`"" -Force | Out-Null
          $app = Start-Process "$dir\ClipboardSync.exe" -PassThru
          Start-Sleep 5
          if ($app.HasExited) { throw "the installed app exited with $($app.ExitCode)" }
          Start-Process "$dir\unins000.exe" -Wait -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          Start-Sleep 3
          if (Test-Path "$dir\ClipboardSync.exe") { throw "still installed" }
          if ((Get-ItemProperty $run).'Clipboard Sync') { throw "the autostart entry survived" }
      - uses: actions/upload-artifact@v6
        with:
          name: windows
          path: build/installer/*.exe

  macos:
    needs: version
    runs-on: macos-26
    env:
      DMG: ClipboardSync-${{ needs.version.outputs.version }}-macos.dmg
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          cmake --build build
          lipo -info build/ClipboardSync.app/Contents/MacOS/ClipboardSync
      - name: Keychain with the signing identity
        env:
          P12: ${{ secrets.MACOS_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 7200 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "MACOS_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
      - name: Deploy, sign, DMG
        run: |
          ditto packaging/licenses build/ClipboardSync.app/Contents/Resources/licenses
          macdeployqt build/ClipboardSync.app -sign-for-notarization="$APP_IDENTITY"
          codesign --verify --deep --strict --verbose=2 build/ClipboardSync.app
          mkdir dmg
          ditto build/ClipboardSync.app "dmg/Clipboard Sync.app"
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Clipboard Sync" -srcfolder dmg -ov -format UDZO "$DMG"
          codesign --sign "$APP_IDENTITY" --timestamp "$DMG"
      - name: Notarise, staple, assess
        env:
          P8: ${{ secrets.APPLE_API_KEY_P8 }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          echo "$P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool submit "$DMG" --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$KEY_ID" \
            --issuer "$ISSUER_ID" --wait --timeout 60m --output-format json | tee "$RUNNER_TEMP/notary.json"
          status=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['status'])" "$RUNNER_TEMP/notary.json")
          if [ "$status" != "Accepted" ]; then
            id=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['id'])" "$RUNNER_TEMP/notary.json")
            xcrun notarytool log "$id" --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$KEY_ID" --issuer "$ISSUER_ID"
            echo "::error::notarisation: $status"; exit 1
          fi
          xcrun stapler staple "$DMG"
          spctl --assess --type open --context context:primary-signature -vvv "$DMG"
      - uses: actions/upload-artifact@v6
        with:
          name: macos
          path: ${{ env.DMG }}
      - name: Clean up
        if: always()
        run: |
          [ -n "$MACOS_KEYCHAIN" ] && security delete-keychain "$MACOS_KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"

  release:
    if: github.ref_type == 'tag'
    needs: [version, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist && sha256sum * > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --title "Clipboard Sync ${{ needs.version.outputs.version }}" \
            --notes "Draft: to be installed and checked on both machines before publishing." ./*
